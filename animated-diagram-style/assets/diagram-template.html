    * { box-sizing: border-box; }

    header { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 16px 24px; background: #fff; border-bottom: 1px solid #dce5ee; }

    .drawing { display: block; width: 100%; max-width: none; height: auto; }
    details { margin-top: 20px; scroll-margin-top: 90px; }
    summary { cursor: pointer; font-size: 16px; font-weight: 600; padding: 12px 0; }
    footer { padding: 0 24px 20px; color: #62758a; font-size: 12px; }
    @media print { header, footer { display: none; } main { padding: 0; } .canvas { overflow: visible; border: 0; } .drawing { width: 100% !important; } }

  <script>
    const zoom = document.getElementById('zoom');
    const scale = document.getElementById('scale');
    function applyZoom() {
      scale.value = zoom.value + '%';
      document.querySelectorAll('.drawing').forEach(image => { image.style.width = zoom.value + '%'; });
    }
    zoom.addEventListener('input', applyZoom);
    document.getElementById('fit').addEventListener('click', () => { zoom.value = '100'; applyZoom(); });
    function revealDetail() {
      const detail = document.getElementById(location.hash.slice(1));
      if (detail && detail.tagName === 'DETAILS') { detail.open = true; detail.scrollIntoView(); }
    }
    window.addEventListener('hashchange', revealDetail);
    window.addEventListener('load', revealDetail);
  </script>
</body>
</html>
